# Demo portfolio (ServiceNow export, JSON) through the generic mapping: every table under its own name,
# columns unchanged. Load it with DATA_SOURCE=mapped and MAPPING_FILE=data/mappings/servicenow_demo.yaml.
# A customer mapping renames sheets and columns, translates values and units and unpivots year columns –
# see docs/DATA_MAPPING.md.
name: Demo portfolio (ServiceNow export)
sources:
  demo:
    type: json
    path: ../DerKurator_Demo_Portfolio.json
default_source: demo
