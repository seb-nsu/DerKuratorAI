[pytest]
testpaths = tests
addopts = -ra -m "not e2e"
# the browser suite (tests/e2e) runs only on request: pytest -m e2e
markers =
    e2e: browser end-to-end tests against the NiceGUI and React front ends (tests/e2e, Playwright)
    neo4j: tests against a Neo4j server (NEO4J_URI etc. from the environment; skipped without NEO4J_URI)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
