[server]
# Local access only – never bind to network or public interfaces
address = "localhost"
headless = true

[browser]
# Never send usage statistics to Streamlit
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"
# Never show tracebacks in the browser (also for errors outside the app's error boundaries, e.g. in widget
# callbacks). Details are in data/app.log; the System Admin sees them via the incident panel.
showErrorDetails = "none"

[theme]
# Corporate theme – navy primary instead of Streamlit red, so primary buttons never read as RAG "Red / critical"
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1B2430"
font = "sans serif"
# Status text colours darker than Streamlit's defaults, so badges (CONDITIONAL GO, Yellow RAG, Draft …) and
# captions reach WCAG AA contrast (4.5:1) on their tinted backgrounds
orangeTextColor = "#8a5a00"
grayTextColor = "#4b5563"
greenTextColor = "#0f6e2e"

[logger]
# INFO, so that Streamlit events are written to data/app.log as well
level = "info"
